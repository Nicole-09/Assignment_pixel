<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
   <div class="container">
        <div class="logo2">AuraTech</div>
        <h1>Create Account</h1>
        <p class="subtitle">Please fill in the details below to create your account.</p>
            <form action="">
                <div class="input-group">
                    <label for="fname">Name</label>
                    <input type="text" id="fname" name="fname" placeholder="Enter your name" required>
                </div><br>

                <div class="input-group">
                    <label for="email">Email Adress</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div><br>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div><br>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                </div><br>

                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the<a href="#">Terms and Conditions</a></label>
                </div><br>

                <button type="submit">Create Account</button><br>

                <p class="login">Already have an account? <a href="signup.html">Login in</a></p>

        </div>

            </form>
   </div>
</body>
</html>
